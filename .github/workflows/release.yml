name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS arm64 (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install launcher UI deps
        run: npm --prefix launcher/ui ci

      - name: Build launcher UI
        run: npm --prefix launcher/ui run build

      - name: Run packaging script (arm64)
        run: chmod +x scripts/package-macos.sh && ./scripts/package-macos.sh ${{ steps.version.outputs.VERSION }} arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-zip
          path: dist/build/xhs-info-crawl-${{ steps.version.outputs.VERSION }}-macos-arm64.zip

  build-macos-x86_64:
    name: Build macOS x86_64 (Intel)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install launcher UI deps
        run: npm --prefix launcher/ui ci

      - name: Build launcher UI
        run: npm --prefix launcher/ui run build

      - name: Run packaging script (x86_64)
        run: chmod +x scripts/package-macos.sh && ./scripts/package-macos.sh ${{ steps.version.outputs.VERSION }} x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-zip
          path: dist/build/xhs-info-crawl-${{ steps.version.outputs.VERSION }}-macos-x86_64.zip

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install launcher UI deps
        run: npm --prefix launcher/ui ci

      - name: Build launcher UI
        run: npm --prefix launcher/ui run build

      - name: Run packaging script
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Version ${{ steps.version.outputs.VERSION }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/build/xhs-info-crawl-${{ steps.version.outputs.VERSION }}-windows.zip

  release:
    name: Create GitHub Release
    # macOS x86_64 (Intel) runner 公共资源严重排队,几小时到几天都可能没调度到。
    # Apple Silicon 已占主流(~95% 新 Mac),x86_64 后补;release 不等它。
    # 关联: docs/superpowers/specs/2026-08-17-launcher-ui-baseurl-pywebview-design.md
    needs: [build-macos-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-zip
          path: artifacts

      - name: Download macOS x86_64 artifact (optional)
        uses: actions/download-artifact@v4
        # 公共 macOS-13 runner 严重排队,x86_64 build job 经常跑不完。
        # 即使没下载到也不让整个 release 失败,x86_64 后补单独 release。
        continue-on-error: true
        with:
          name: macos-x86_64-zip
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # x86_64 不一定有(公共 runner 排队严重),文件不存在也不要失败。
          fail_on_unmatched_files: false
          files: |
            artifacts/xhs-info-crawl-${{ steps.version.outputs.VERSION }}-macos-arm64.zip
            artifacts/xhs-info-crawl-${{ steps.version.outputs.VERSION }}-macos-x86_64.zip
            artifacts/xhs-info-crawl-${{ steps.version.outputs.VERSION }}-windows.zip
          generate_release_notes: true