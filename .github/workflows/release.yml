name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # 允许手动重跑 release 工作流(比如 x86_64 runner 排队严重时,
  # 可以在 Actions 标签页手动触发,不依赖 push tag;必须填 VERSION)。
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (e.g. 0.6.0),workflow_dispatch 必须填'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS arm64 (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install launcher UI deps
        run: npm --prefix launcher/ui ci

      - name: Build launcher UI
        run: npm --prefix launcher/ui run build

      - name: Run packaging script (arm64)
        run: chmod +x scripts/package-macos.sh && ./scripts/package-macos.sh ${{ steps.version.outputs.VERSION }} arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-zip
          path: dist/build/xhs-info-crawl-${{ steps.version.outputs.VERSION }}-macos-arm64.zip

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install launcher UI deps
        run: npm --prefix launcher/ui ci

      - name: Build launcher UI
        run: npm --prefix launcher/ui run build

      - name: Run packaging script
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Version ${{ steps.version.outputs.VERSION }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/build/xhs-info-crawl-${{ steps.version.outputs.VERSION }}-windows.zip

  release:
    name: Create GitHub Release
    needs: [build-macos-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-zip
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # workflow_dispatch 创建的 Release 也要找正确 tag
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: |
            artifacts/xhs-info-crawl-${{ steps.version.outputs.VERSION }}-macos-arm64.zip
            artifacts/xhs-info-crawl-${{ steps.version.outputs.VERSION }}-windows.zip
          generate_release_notes: true